<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix Clone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            NETFLIX
        </div>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">TV Shows</a>
            <a href="#">Movies</a>
            <a href="#">New &amp; Popular</a>
            <a href="#">My List</a>
        </nav>

        <div class="nav-right">

            <button class="language">
                🌐 English <span>⌄</span>
            </button>

            <button class="sign-in">
                Sign In
            </button>

        </div>

    </header>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="hero-content">

            <h1>
                Unlimited<br>
                movies, TV shows<br>
                and more
            </h1>

            <h2>
                Watch anywhere. Cancel anytime.
            </h2>

            <p>
                Ready to watch? Enter your email to create
                or restart your membership.
            </p>

            <div class="email-box">

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                >

                <button id="getStarted">
                    Get Started <span>›</span>
                </button>

            </div>

        </div>

    </section>


    <!-- ================= TRENDING ================= -->

    <section class="trending">

        <h2>
            Trending Now on Netflix
        </h2>

        <div class="movie-row">

            <div class="movie-card">
                <img
                    src="assets/poster-stranger-things.svg"
                    alt="Stranger Things"
                >
            </div>

            <div class="movie-card">
                <img
                    src="assets/poster-wednesday.svg"
                    alt="Wednesday"
                >
            </div>

            <div class="movie-card">
                <img
                    src="assets/poster-deadpool.svg"
                    alt="Deadpool"
                >
            </div>

            <div class="movie-card">
                <img
                    src="assets/poster-witcher.svg"
                    alt="The Witcher"
                >
            </div>

            <div class="movie-card">
                <img
                    src="assets/poster-lupin.svg"
                    alt="Lupin"
                >
            </div>

            <div class="movie-card">
                <img
                    src="assets/poster-peaky-blinders.svg"
                    alt="Peaky Blinders"
                >
            </div>

            <button class="next">
                ›
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
